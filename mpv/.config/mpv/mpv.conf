# ==== Output / Decode  (NVIDIA RTX 3060 + sway/Wayland) ====
vo=gpu-next
gpu-api=vulkan
hwdec=no                # Force CPU (software) decode.
video-sync=display-resample   # Lock presentation to the monitor refresh; resample audio ~0.1% to absorb 23.976-vs-24 drift.

# ==== HDR: tone-map in mpv (not passthrough) ====
# Map source HDR down to this panel's capability.
tone-mapping=spline
hdr-compute-peak=yes
target-peak=580

# ==== Chroma upscaling (4:2:0 -> 4:4:4 for the unavoidable YUV->RGB conversion) ====
# EWA/jinc scaler for crisp color edges; antiring tames the halos/ringing.
cscale=ewa_lanczossharp
cscale-antiring=0.8

# ==== Dithering to the output bit depth (sway render_bit_depth 10 / 8-bit+FRC panel) ====
# error-diffusion has no repeating pattern -> cleanest gradients.
dither-depth=auto
dither=error-diffusion
error-diffusion=sierra-lite

# ==== Debanding (gentle — kills HDR/gradient banding without smearing anime line art) ====
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=0          # don't inject grain to mask banding (source is already grainy)

# ==== DEFAULT = anime / bit-perfect ====
# Lock video to native pixel size, centered, no resampling. 1080p (or smaller)
# shows 1:1 on the 1440p panel — black bars, zero upscale blur.
video-unscaled=yes

# ==== AUTO = 4K source -> high-quality downscale to 1440p ====
# Fires whenever the decoded video is taller than the panel; restores the
# bit-perfect default for anything 1440p or smaller.
[downscale-to-panel]
profile-cond=height ~= nil and height > 1440
profile-restore=copy-equal
video-unscaled=no
dscale=ewa_lanczos
dscale-radius=3
correct-downscaling=yes
linear-downscaling=yes
